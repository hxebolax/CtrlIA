# Manifiesto del complemento de NVDA (PLANTILLA del agente «complemento-nvda»).
#
# tools/construir_complemento.py sustituye los marcadores @NOMBRE@, @VERSION@,
# @NVDA_MINIMA@, @NVDA_PROBADA@, @AUTOR@, @URL@ y @CAMBIOS@. Si un marcador
# opcional (@URL@, @CAMBIOS@) queda vacío, se quita la línea entera.
#
# Este manifiesto raíz va en inglés, como hace NVDA: es el que ve quien usa NVDA
# en un idioma sin traducción. El texto en español está en
# addon/locale/es/manifest.ini y NVDA lo elige solo si su idioma es el español.
name = @NOMBRE@
summary = "MiAplicacion: better screen reader support"
description = """Improves how NVDA reads MiAplicacion: full text of list cells beyond 511 characters, no repeated announcement when the application moves the focus by itself, and NVDA+shift+j to read the whole focused row."""
author = "@AUTOR@"
url = @URL@
version = @VERSION@
changelog = """@CAMBIOS@"""
docFileName = readme.html
minimumNVDAVersion = @NVDA_MINIMA@
lastTestedNVDAVersion = @NVDA_PROBADA@
